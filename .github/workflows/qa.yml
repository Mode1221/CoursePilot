# 운영 사이트 자동 QA — 사람이 매번 눌러 보던 핵심 흐름을 3시간마다, 그리고 배포 직후 한 번 돌린다.
#
#   헬스(API·DB) → 주요 페이지(/, /start, /login, 약관) → 로그인 수단 노출
#   → (QA_TOKEN 이 있으면) 같이 정하기: 링크 → 상대 카드 → 자동 합치기 → 둘 다 수락 → 공유 화면 읽기 전용
#
# QA 요청은 `X-QA-Token` 으로 표시돼 서버가 학습 신호(인기·공동 채택 등)를 쌓지 않고, 만든 코스는 끝에 지운다.
# 실패하면 저장소에 "운영 QA 실패" 이슈를 열고(저장소 주인에게 메일), 다시 통과하면 닫는다.
#
# 설정(한 번): GitHub Secrets 에 QA_TOKEN(VM .env 의 QA_TOKEN 과 같은 값). 선택: ALERT_WEBHOOK_URL.
name: Production QA

on:
  schedule:
    - cron: "7 */3 * * *"  # 3시간마다(UTC) — 한국 시각 09·12·15·18·21·00·03·06시 7분
  workflow_dispatch:  # 배포가 끝나면 release.yml 이 실행한다(자동 머지가 연 실행은 workflow_run 을 깨우지 않아서)

concurrency:
  group: prod-qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: frontend
    env:
      QA_BASE_URL: ${{ vars.QA_BASE_URL || 'https://coursepilot-kr.duckdns.org' }}
      QA_API_URL: ${{ vars.QA_API_URL }}
      QA_TOKEN: ${{ secrets.QA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # 배포 직후엔 컨테이너가 막 떴다 — 헬스가 초록이 될 때까지 잠깐 기다린다(최대 2분)
      - name: 서버 준비 대기
        run: |
          api="${QA_API_URL:-https://api.${QA_BASE_URL#https://}}"
          for i in $(seq 1 24); do
            curl -fsS -m 5 "$api/health" >/dev/null && exit 0
            sleep 5
          done
          echo "헬스체크 2분 대기 초과" && exit 1

      - name: 운영 점검
        id: qa
        run: pnpm test:prod

      - name: 실패 기록 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/qa-report.json
          retention-days: 14

      - name: 실패 → 이슈(메일)·웹훅
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          failed="$(node -e '
            try {
              const r = require("./qa-report.json"); const out = [];
              const walk = (s) => { (s.specs||[]).forEach(sp => sp.tests.forEach(t => { if (t.results.some(x => x.status !== "passed" && x.status !== "skipped") && t.results.at(-1).status !== "passed") out.push(sp.title); })); (s.suites||[]).forEach(walk); };
              (r.suites||[]).forEach(walk); console.log(out.join(", ") || "알 수 없음");
            } catch { console.log("보고서 없음"); }')"
          body="운영 QA 실패 ($(date -u +%FT%TZ)) — 실패한 점검: ${failed}
          실행: ${run_url} (스크린샷·트레이스는 Artifacts)"
          gh label create qa-failure --color B60205 --description "운영 자동 QA 실패" --force >/dev/null 2>&1 || true
          issue="$(gh issue list --label qa-failure --state open --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "운영 QA 실패" --label qa-failure --body "$body"
          fi
          if [ -n "$HOOK" ]; then
            curl -sS -m 10 -X POST -H "Content-Type: application/json" \
              -d "$(node -e 'console.log(JSON.stringify({text: process.argv[1], kind: "qa", target: "prod"}))' "[픽앤어스] $body")" \
              "$HOOK" >/dev/null || true
          fi

      - name: 통과 → 열린 실패 이슈 닫기
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --label qa-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "다시 통과했어요: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
