# 이미지는 CI 에서 굽고, VM 은 pull 만 한다.
#
# 배포 대상은 Oracle Cloud Ampere(arm64) 1~2 OCPU 다. 거기서 Next.js 를 빌드하면
# 수십 분이 걸리거나 메모리가 모자라 죽는다. 그래서 여기서 linux/arm64 이미지를
# 만들어 GHCR 에 올리고, 서버는 받아서 띄우기만 한다.
# 빌드는 arm64 러너에서 네이티브로 돈다(QEMU 에뮬레이션보다 몇 배 빠르다).
name: Release images

on:
  push:
    branches: [main]
  workflow_dispatch:  # 필요할 때 수동으로도 굽는다

concurrency:
  group: release-images
  cancel-in-progress: true  # 연속 머지 시 마지막 것만 굽는다

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # 공개 저장소라 arm64 러너를 무료로 쓸 수 있다 → QEMU 크로스 빌드 없이 네이티브.
    # (비공개로 전환하면 ubuntu-latest + setup-qemu-action 으로 되돌려야 한다)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름을 소문자로
        id: name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          # 커밋 sha 로 고정 배포하고, latest 는 편의를 위해 함께 올린다
          tags: |
            ${{ env.REGISTRY }}/${{ steps.name.outputs.repo }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.name.outputs.repo }}-${{ matrix.name }}:latest
          # 지도 SDK 키만 빌드 시점에 필요하다(NEXT_PUBLIC_*).
          # API 주소는 런타임에 호스트에서 유도하므로 빌드 인자로 넣지 않는다.
          build-args: |
            NEXT_PUBLIC_NAVER_MAP_CLIENT_ID=${{ vars.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # 이미지가 올라가면 바로 VM 에 배포한다(크론 5분 대기 없이). 비밀값이 없으면 건너뛰고 크론이 한다.
  #
  # SSH 키는 VM 의 authorized_keys 에 command= 로 묶여 **배포 스크립트 하나만** 실행할 수 있다
  # (셸·포트 포워딩 불가). 넣을 값은 VM 에서 scripts/ops/setup_deploy_key.sh 가 출력한다.
  # 비밀값: DEPLOY_HOST · DEPLOY_USER · DEPLOY_SSH_KEY · DEPLOY_KNOWN_HOSTS
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-vm
      cancel-in-progress: false  # 배포 도중에 끊으면 반쯤 올라간 상태가 된다
    permissions:
      contents: read
      actions: write  # 배포 뒤 운영 QA 를 직접 실행한다(자동 머지가 연 실행은 workflow_run 을 깨우지 않는다)
    steps:
      - name: VM 에 배포
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$HOST" ] || [ -z "$KEY" ] || [ -z "$KNOWN" ]; then
            echo "배포 비밀값이 없어 건너뜀 — VM 크론(5분)이 대신 배포한다."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          # 강제 명령이라 보내는 문자열은 "deploy <sha>" 형식 검사에만 쓰인다
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "${USER_:-ubuntu}@$HOST" "deploy $GITHUB_SHA"

      - name: 운영 QA 실행
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run qa.yml --ref main || echo "운영 QA 실행 요청 실패(3시간 주기 점검이 대신 돈다)"

      - name: 운영 지표 갱신 (Atelier 본부)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ops-stats.yml --ref main || echo "운영 지표 갱신 요청 실패(매일 0시 23분에 다시 돈다)"
