# 이미지는 CI 에서 굽고, VM 은 pull 만 한다.
#
# 배포 대상은 Oracle Cloud Ampere(arm64) 1~2 OCPU 다. 거기서 Next.js 를 빌드하면
# 수십 분이 걸리거나 메모리가 모자라 죽는다. 그래서 여기서 linux/arm64 이미지를
# 만들어 GHCR 에 올리고, 서버는 받아서 띄우기만 한다.
name: Release images

on:
  push:
    branches: [main]
  workflow_dispatch:  # 필요할 때 수동으로도 굽는다

concurrency:
  group: release-images
  cancel-in-progress: true  # 연속 머지 시 마지막 것만 굽는다

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름을 소문자로
        id: name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # arm64 는 러너(x86)와 아키텍처가 다르다 → QEMU 로 크로스 빌드
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          # 커밋 sha 로 고정 배포하고, latest 는 편의를 위해 함께 올린다
          tags: |
            ${{ env.REGISTRY }}/${{ steps.name.outputs.repo }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.name.outputs.repo }}-${{ matrix.name }}:latest
          # 지도 SDK 키만 빌드 시점에 필요하다(NEXT_PUBLIC_*).
          # API 주소는 런타임에 호스트에서 유도하므로 빌드 인자로 넣지 않는다.
          build-args: |
            NEXT_PUBLIC_NAVER_MAP_CLIENT_ID=${{ vars.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
